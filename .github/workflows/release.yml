name: Build and Release

on:
  workflow_dispatch:

# Two runs at once would bump to the same version.
concurrency: release

jobs:
  # Every run bumps VERSION, commits it to main and tags the commit; the builds
  # and the release use that tag.
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump version and tag
        id: resolve
        run: |
          set -euo pipefail
          IFS='.' read -r VMAJOR VMINOR VPATCH < VERSION
          VPATCH=$((VPATCH + 1))
          if [ "$VPATCH" -gt 9 ]; then
            VPATCH=0
            VMINOR=$((VMINOR + 1))
            if [ "$VMINOR" -gt 9 ]; then
              VMINOR=0
              VMAJOR=$((VMAJOR + 1))
            fi
          fi
          NEW_VERSION="${VMAJOR}.${VMINOR}.${VPATCH}"
          TAG="v${NEW_VERSION}"
          echo "$NEW_VERSION" > VERSION

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add VERSION
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin main
          git tag "$TAG"
          git push origin "$TAG"

          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

  build-portmaster:
    needs: resolve-version
    uses: ./.github/workflows/portmaster.yml
    with:
      ref: ${{ needs.resolve-version.outputs.tag }}

  build-android:
    needs: resolve-version
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.resolve-version.outputs.tag }}
    secrets: inherit

  build-desktop:
    needs: resolve-version
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.resolve-version.outputs.tag }}

  release:
    needs: [resolve-version, build-portmaster, build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
          fetch-depth: 0

      - name: Release notes from commits
        id: notes
        run: |
          set -euo pipefail
          TAG=${{ needs.resolve-version.outputs.tag }}
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | grep -vx "$TAG" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..$TAG"; else RANGE="$TAG"; fi
          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:'- %s' | grep -v '^- chore: bump version' | head -50 || true)
          echo "Changes since ${PREV_TAG:-the first commit}:"
          echo "$COMMITS"
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          {
            echo "notes<<${EOF_MARKER}"
            echo "${COMMITS:-- No changes listed.}"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_OUTPUT"

      - name: Download PortMaster zip
        uses: actions/download-artifact@v4
        with:
          name: portmaster-zip
          path: dist/

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/

      - name: Download macOS zip
        uses: actions/download-artifact@v4
        with:
          name: macos-zip
          path: dist/

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Hot Wheels Stunt Track Driver port ${{ needs.resolve-version.outputs.tag }}
          body: |
            ### Changes

            ${{ steps.notes.outputs.notes }}

            ---

            Runs the original 1998 Windows game through box64 + Wine. **Game files are not included**: you need your own copy of the CD.

            | Platform | File | Notes |
            |--|--|--|
            | 🎮 PortMaster (ARM64 handhelds) | `hwstd.zip` | Tested on Knulli (RG34XX-SP, H700). Needs the Westonpack runtime (`weston_pkg_0.2`), which PortMaster downloads. |
            | 🤖 Android (arm64) | `hwstd-android-arm64.apk` | Built on Winlator (Wine + Box64). Installs next to Winlator. |
            | 🍎 macOS (Apple Silicon via Rosetta 2, Intel) | `HWSTD-macos.zip` | App with a bundled Wine. Unsigned: right-click → Open the first time. |
            | 🪟 Windows 10/11 | `HWSTD-windows.zip` | Installer copies the game from your ISO and adds cnc-ddraw. No admin rights needed. |

            ### PortMaster install
            1. Extract `hwstd.zip` into your `ports/` folder (it creates `Hot Wheels Stunt Track Driver.sh` and `hwstd/`).
            2. Copy everything inside the CD's `setup/hot98/` folder into `ports/hwstd/gamedata/`, or drop the CD image (`.iso`) into `ports/hwstd/`.
            3. Refresh the game list and start it from Ports. The first launch prepares Wine and takes a couple of minutes.

            ### Android install
            1. Install `hwstd-android-arm64.apk` and open **Stunt Track Driver**.
            2. Allow storage access and wait for the system files to install (first launch only).
            3. Pick the game's `.iso` in the file picker. The game files are copied into the app, then the game starts.
            4. Touch: drag to move the mouse, tap to click; on-screen arrows drive. Xbox-style gamepads work too. Press Back or Select for **Game Settings** (hide controls, stretch screen, gamepad).

            ### macOS install
            1. Unzip `HWSTD-macos.zip` and move **Hot Wheels Stunt Track Driver** to Applications.
            2. The app is not signed: right-click it → **Open** the first time (or run `xattr -cr "/Applications/Hot Wheels Stunt Track Driver.app"`). Apple Silicon needs Rosetta 2.
            3. Pick your CD image (`.iso`) when asked. The first launch prepares Wine.

            ### Windows install
            1. Unzip `HWSTD-windows.zip`, put your CD image (`.iso`) in the `HWSTD` folder (or pick it when asked) and run `Install.cmd`.
            2. Play with `Play.cmd`.
          files: |
            dist/hwstd.zip
            dist/hwstd-android-arm64.apk
            dist/HWSTD-macos.zip
            dist/HWSTD-windows.zip
          prerelease: false
