; cnc-ddraw settings (https://github.com/FunkyFr3sh/cnc-ddraw)
; Edit ~/Library/Application Support/HWSTD/game/ddraw.ini to change them.
[ddraw]
; 2x window, keeps 4:3 when resized. fullscreen=true for full screen.
fullscreen=false
windowed=true
width=1280
height=960
maintas=true
renderer=gdi
adjmouse=true
